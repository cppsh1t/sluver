[package]
name = "sluver"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sluver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to ^2.11 to unlock `data-tauri-drag-region="deep"` (propagates window
# drag to non-interactive descendants) used by the TitleBar Space tabs (ADR-0009).
# `tray-icon` is a NON-DEFAULT feature and must stay explicit (ADR-0008 tray re-lock).
tauri = { version = "2.11", features = ["tray-icon"] }
# argon2id password hashing (ADR-0008: auth-gate only, NOT at-rest encryption).
# Default features include `password-hash`, `alloc`, and `rand` — no flags needed.
# NOTE: argon2 0.5 pulls `password-hash` WITHOUT its `getrandom` feature, so
# `argon2::password_hash::rand_core::OsRng` (needed by `SaltString::generate`)
# is unreachable out of the box. Adding `password-hash` here with `getrandom`
# turns that feature on via cargo feature unification — no extra crate is
# introduced (`password-hash` is already a transitive dep of argon2).
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
# Native dialog plugin (directory picker for log export — replaces the old
# "dump to downloads dir" default with a user-chosen destination).
tauri-plugin-dialog = "2"
# Native OS notifications (tool consent gate — ADR-0025 / ADR-0036): surfaces
# pending approvals even when the conversation is not the visible one. Used
# directly (notify-rust) rather than via tauri-plugin-notification — see
# ADR-0036 for why the plugin's dev-mode AUMID fallback is broken on
# Windows 11 24H2+.
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-decorum = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.5.0"
uuid = { version = "1.23.4", features = ["v7"] }
chrono = "0.4.45"
thiserror = "2.0.18"
# Async HTTP client for models.dev catalog fetch (ADR-0012). rustls-tls avoids
# a Windows OpenSSL dependency; `default-features = false` drops native-tls.
# NO `blocking` feature — catalog commands are async (see commands/ai.rs).
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Web search (commands/search.rs): HTML parsing of Bing's results page.
# `url` is a transitive dep of reqwest but must be declared explicitly to use
# `Url::parse` + `query_pairs()` for unwrapping Bing's `/ck/a?...&u=a1<base64url>`
# tracking-redirect URLs.
scraper = "0.23"
url = "2"

# Web fetch (commands/search.rs::fetch_url): Mozilla Readability port for
# extracting main article content from fetched HTML pages. Default features
# include the HTML parser + metadata extraction.
readabilityrs = "0.1.3"

# Async runtime primitives for the WebView fetch orchestration
# (commands/search.rs::fetch_url_via_webview). Tauri uses tokio internally;
# declaring it directly unlocks `Notify`, `time::timeout`, `spawn_blocking`
# — all needed to coordinate the hidden-window lifecycle without blocking.
# `macros` is additionally used by commands/shell.rs (`tokio::select!`).
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

# Agent shell execution (commands/shell.rs — ADR-0041): cross-platform shell
# semantics with no cmd.exe/PowerShell in the loop. Parse-to-AST first,
# built-ins in-process, externals resolved via `which` and spawned directly.
# Kill path verified against 0.33.x source: KillSignal::send(SIGTERM) →
# child.start_kill() (TerminateProcess), plus every spawned child is assigned
# to a per-ShellState Windows Job Object with KILL_ON_JOB_CLOSE (tree kill +
# crash safety). Futures are !Send — commands/shell.rs drives them on
# dedicated blocking threads.
deno_task_shell = "0.33.3"

# Logging stack (ADR-0014): `tracing` ecosystem + `tracing-log` bridge so that
# `log::*` emits from deps (tauri, rusqlite, reqwest, tokio) are captured by
# the same subscriber that owns our structured JSON-lines file writer
# (ADR-0015). `json` feature is required by `fmt::layer().json()`.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
tracing-log = "0.2.0"

# Diagnostics log export (ADR-0015): produces the zip archive the
# `export_logs` command hands back to the user. `default-features = false`
# + `deflate` only — drops unsupported codecs (bzip2/zstd/lzma) to keep
# the binary slim. Pinned to `^8` (latest stable line as of writing).
zip = { version = "8", default-features = false, features = ["deflate"] }

# Per-entity image upload (BLOB + mime). Used by the `update_*_image`
# commands to decode base64 payloads sent from the frontend before
# writing to SQLite. `default-features = false` keeps the crate
# minimal — we only need the standard alphabet.
base64 = { version = "0.22", default-features = false }

# Agent Skills (commands/skill.rs — ADR-0043): SKILL.md frontmatter
# parsing. serde_yaml is archived upstream but stable and dependency-light;
# the frontmatter grammar is tiny and fixed (a `name` + `description` map),
# so the maintenance risk is nil.
serde_yaml = "0.9"

# System font enumeration (commands/font.rs): the resvg project's
# cross-platform in-memory font database. `load_system_fonts` scans the
# predefined OS font directories (no system API interaction); we only
# read family names — no rasterization, no querying.
fontdb = "0.24"

# Novel export to EPUB (src/export.rs). `default-features = false` +
# `zip-library` selects the pure-Rust zip backend (no system `zip` binary
# dependency). epub-builder 0.8 pulls `zip ^6` transitively; it coexists with
# our direct `zip = "8"` dep above (different majors resolve as separate crates
# in the dependency tree).
epub-builder = { version = "0.8", default-features = false, features = ["zip-library"] }

# Image codec pipeline:
#   - EPUB export (src/export.rs): WebP → PNG transcoding (EPUB readers have
#     inconsistent WebP support, so covers/illustrations are transcoded to
#     PNG before embedding).
#   - `fetch_and_prepare_image` (commands/search.rs): download a remote image,
#     center-crop + resize, then re-encode as lossless WebP for the per-entity
#     `image_blob` columns. Decodes JPEG/PNG/WebP (covers virtually every web
#     image source); encodes via the built-in lossless WebP encoder (no C
#     dependency — `image-webp` provides a pure-Rust encoder; lossy encoding
#     would require the separate `webp` crate with libwebp-sys).
# `default-features = false` + only the codecs we use keeps the compiled
# footprint minimal — no GIF/BMP/TIFF/AVIF/etc. decoders are pulled in.
#
# Pinned to `=0.25.2` to avoid an upstream packaging regression: image 0.25.10
# pulled `zune-core ^0.5.0`, but only 0.5.0-rc* prereleases have been
# published — meaning a clean `cargo build` fails on version selection.
# 0.25.2 is the last stable release that uses `zune-core 0.4.x` for JPEG.
# Revisit once zune-core 0.5.0 stable ships.
image = { version = "=0.25.2", default-features = false, features = ["webp", "png", "jpeg"] }

[dev-dependencies]
# Filesystem isolation for DbManager / command integration tests (T10 stress test).
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# WebView2 COM interop for `fetch_url_via_webview` (commands/search.rs). The
# version must match what wry 0.55 pulls transitively (0.38.x). Provides
# `ExecuteScriptCompletedHandler` and the `ICoreWebView2` COM interface types
# needed to extract rendered HTML from a hidden WebView2 window — Tauri's
# `eval()` is fire-and-forget and cannot return JS results.
webview2-com = "0.38"
# `HSTRING` + `PCWSTR` for the `ICoreWebView2::ExecuteScript` call.
windows = { version = "0.61", default-features = false }
# HKCU registry access for the AUMID self-registration in
# commands/notification.rs (ADR-0036) — DisplayName/IconUri under
# `Software\Classes\AppUserModelId\{id}` so toasts render for this
# unpackaged app in dev builds.
winreg = "0.55"

